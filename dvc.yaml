stages:
  generate_data:
    cmd: uv run --extra dev python src/data_generator.py --n-samples ${data.n_samples} --seed ${data.seed} --start-date ${data.start_date} --output ${data.raw_path}
    deps:
      - src/data_generator.py
      - src/preprocessing_api/service.py
    params:
      - data.n_samples
      - data.seed
      - data.start_date
      - data.raw_path
    outs:
      - data/raw/sample_data.csv
  train_model:
    cmd: uv run --extra dev python scripts/train_model.py --input data/raw/sample_data.csv --output models/cognitive_load_model.joblib
    deps:
      - scripts/train_model.py
      - src/data_generator.py
      - src/preprocessing_api/features.py
      - data/raw/sample_data.csv
    params:
      - model.output_path
      - model.experiment_name
      - model.registered_model_name
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - models/cognitive_load_model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
  drift_report:
    cmd: uv run --extra dev python scripts/generate_drift_report.py --reference data/processed/train.csv --current data/processed/test.csv --output ${reports.drift_report}
    deps:
      - scripts/generate_drift_report.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - reports.drift_report
    outs:
      - reports/evidently/data_drift.html:
          cache: false
