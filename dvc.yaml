stages:
  generate_data:
    cmd: uv run --extra dev python src/data_generator.py --n-samples ${data.n_samples} --seed ${data.seed} --start-date ${data.start_date} --output ${data.raw_path}
    deps:
      - src/data_generator.py
      - src/preprocessing_api/service.py
    params:
      - data.n_samples
      - data.seed
      - data.start_date
      - data.raw_path
    outs:
      - data/raw/sample_data.csv
  train_model:
    cmd: uv run --extra dev python scripts/train_model.py --input ${data.raw_path} --output ${model.output_path} --report ${module1_evaluation.report_path} --train-output ${module1_evaluation.train_path} --validation-output ${module1_evaluation.validation_path} --audit-output ${module1_evaluation.audit_path} --train-fraction ${module1_evaluation.train_fraction} --validation-fraction ${module1_evaluation.validation_fraction} --random-seed ${module1_evaluation.random_seed} --experiment-name ${module1_evaluation.experiment_name} --tracking-uri ${module1_evaluation.tracking_uri}
    deps:
      - scripts/train_model.py
      - src/cogniflow_data/training.py
      - src/data_generator.py
      - src/preprocessing_api/features.py
      - data/raw/sample_data.csv
    params:
      - model.output_path
      - module1_evaluation.random_seed
      - module1_evaluation.train_fraction
      - module1_evaluation.validation_fraction
      - module1_evaluation.experiment_name
      - module1_evaluation.train_path
      - module1_evaluation.validation_path
      - module1_evaluation.audit_path
      - module1_evaluation.report_path
      - module1_evaluation.tracking_uri
    outs:
      - data/processed/train.csv
      - data/processed/validation.csv
      - data/processed/previously_observed.csv
      - models/cognitive_load_model.joblib
    metrics:
      - reports/metrics.json:
          cache: false
  drift_report:
    cmd: uv run --extra dev python scripts/generate_drift_report.py --reference ${module1_evaluation.train_path} --current ${module1_evaluation.validation_path} --output ${reports.drift_report}
    deps:
      - scripts/generate_drift_report.py
      - data/processed/train.csv
      - data/processed/validation.csv
    params:
      - reports.drift_report
      - module1_evaluation.train_path
      - module1_evaluation.validation_path
    outs:
      - reports/evidently/data_drift.html:
          cache: false
  historical_features:
    cmd: env PYTHONPATH=src uv run python scripts/build_historical_features.py --input ${historical.fixture} --output ${historical.output} --metadata ${historical.metadata} --code-revision ${historical.code_revision}
    deps:
      - scripts/build_historical_features.py
      - src/cogniflow_data/historical.py
      - src/preprocessing_api/features.py
      - tests/fixtures/historical_features.json
    params:
      - historical.code_revision
      - historical.fixture
      - historical.output
      - historical.metadata
    outs:
      - data/processed/historical_features.jsonl
      - data/processed/historical_features.manifest.json
  phase2_fixture:
    cmd: env PYTHONPATH=src uv run python scripts/generate_training_fixture.py --features data/processed/module3/training_features.jsonl --labels data/processed/module3/training_labels.jsonl --manifest data/processed/module3/feature_manifest.json --samples ${module3_phase2.samples}
    deps:
      - scripts/generate_training_fixture.py
      - src/cogniflow_data/historical.py
      - src/preprocessing_api/features.py
    params:
      - module3_phase2.samples
    outs:
      - data/processed/module3/training_features.jsonl
      - data/processed/module3/training_labels.jsonl
      - data/processed/module3/feature_manifest.json
  phase2_dataset:
    cmd: env PYTHONPATH=src uv run python scripts/prepare_training_dataset.py --features data/processed/module3/training_features.jsonl --feature-manifest data/processed/module3/feature_manifest.json --labels data/processed/module3/training_labels.jsonl --output data/processed/module3/training_dataset.jsonl --output-manifest data/processed/module3/training_manifest.json --training-cutoff ${module3_phase2.training_cutoff} --git-revision ${module3_phase2.git_revision}
    deps:
      - scripts/prepare_training_dataset.py
      - src/cogniflow_data/training.py
      - data/processed/module3/training_features.jsonl
      - data/processed/module3/training_labels.jsonl
      - data/processed/module3/feature_manifest.json
    params:
      - module3_phase2.git_revision
      - module3_phase2.training_cutoff
    outs:
      - data/processed/module3/training_dataset.jsonl
      - data/processed/module3/training_manifest.json
  phase2_train:
    cmd: env PYTHONPATH=src uv run python scripts/train_historical_model.py --dataset data/processed/module3/training_dataset.jsonl --manifest data/processed/module3/training_manifest.json --output models/cognitive_load_phase2.joblib --report reports/module3/phase2-metrics.json --tracking-uri sqlite:///mlflow-phase2.db
    deps:
      - scripts/train_historical_model.py
      - src/preprocessing_api/features.py
      - data/processed/module3/training_dataset.jsonl
      - data/processed/module3/training_manifest.json
    outs:
      - models/cognitive_load_phase2.joblib
      - reports/module3/phase2-metrics.json:
          cache: false
  multimodal_fixture:
    cmd: env PYTHONPATH=src uv run python scripts/generate_multimodal_fixture.py --output data/processed/multimodal/source_snapshot.json --samples ${multimodal.samples} --seed ${multimodal.seed}
    deps:
      - scripts/generate_multimodal_fixture.py
      - src/cogniflow_data/multimodal.py
      - src/cogniflow_contracts/models.py
    params:
      - multimodal.samples
      - multimodal.seed
    outs:
      - data/processed/multimodal/source_snapshot.json
  multimodal_dataset:
    cmd: env PYTHONPATH=src uv run python scripts/build_multimodal_dataset.py --snapshot data/processed/multimodal/source_snapshot.json --allow-synthetic-fixture --dataset data/processed/multimodal/dataset.jsonl --manifest data/processed/multimodal/dataset.manifest.json --splits data/processed/multimodal/splits.json --random-seed ${multimodal.seed}
    deps:
      - scripts/build_multimodal_dataset.py
      - src/cogniflow_data/multimodal.py
      - data/processed/multimodal/source_snapshot.json
    params:
      - multimodal.seed
    outs:
      - data/processed/multimodal/dataset.jsonl
      - data/processed/multimodal/dataset.manifest.json
      - data/processed/multimodal/splits.json
  multimodal_experiments:
    cmd: env PYTHONPATH=src uv run python scripts/run_multimodal_experiments.py --dataset data/processed/multimodal/dataset.jsonl --manifest data/processed/multimodal/dataset.manifest.json --splits data/processed/multimodal/splits.json --output-dir models/multimodal --report reports/multimodal/engineering-validation.json --tracking-uri sqlite:///data/processed/multimodal/mlflow.db --validation-scope engineering_validation
    deps:
      - scripts/run_multimodal_experiments.py
      - src/cogniflow_data/multimodal.py
      - data/processed/multimodal/dataset.jsonl
      - data/processed/multimodal/dataset.manifest.json
      - data/processed/multimodal/splits.json
    outs:
      - models/multimodal
      - data/processed/multimodal/mlflow.db
      - data/processed/multimodal/mlartifacts
    metrics:
      - reports/multimodal/engineering-validation.json:
          cache: false
  focus_fixture_package:
    cmd: env PYTHONPATH=src uv run python scripts/package_focus_model.py --model models/multimodal/experiment-C.skops --report reports/multimodal/engineering-validation.json --dataset-manifest data/processed/multimodal/dataset.manifest.json --output-dir models/focus-fixture --modality C --model-name focus-effort-fixture --model-version 1
    deps:
      - scripts/package_focus_model.py
      - src/cogniflow_focus/package.py
      - models/multimodal/experiment-C.skops
      - reports/multimodal/engineering-validation.json
      - data/processed/multimodal/dataset.manifest.json
    outs:
      - models/focus-fixture
