replicaCount: 2
deploymentOwner: module3-standard

image:
  repository: ghcr.io/OWNER/REPO/cognitive-load-api
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8000"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      percent: 100
      periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      percent: 50
      periodSeconds: 60

config:
  appEnv: production
  logLevel: INFO
  enableTracing: "true"
  otelExporterOtlpEndpoint: http://tempo.monitoring.svc.cluster.local:4317
  kserveTimeoutSeconds: "3"
  inferenceMode: demo_rule
  modelVersion: ""
  modelName: ""
  modelPath: ""
  modelSha256: ""
  modelArtifactSha256: ""
  modelDatasetSha256: ""
  modelFeatureSchemaVersion: ""
  inferenceActivityEnabled: "false"
  inferenceActivityDestination: ""
  inferenceActivityTimeoutSeconds: "1"

# Pre-create this Secret with COGNIFLOW_API_KEY. Digests are public integrity
# metadata; credentials never belong in Helm values or ConfigMaps.
existingSecret: ""

kserve:
  enabled: false
  deploymentMode: Standard
  name: cognitive-load-classifier
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  image:
    repository: ghcr.io/OWNER/REPO/cogniflow-kserve
    digest: ""
    pullPolicy: IfNotPresent
  predictor:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  knativeAutoscaling:
    minScale: 0
    maxScale: 3
    targetConcurrency: 1
    scaleDownDelay: 0s
    scaleToZeroPodRetentionPeriod: 0s

ingress:
  enabled: false
  authSecret: ""
  className: nginx
  annotations: {}
  hosts:
    - host: cognitive-load.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  kserveNamespace: cogniflow
  eventingNamespace: knative-eventing
  observabilityNamespace: monitoring
  knativeServingNamespace: knative-serving

eventing:
  brokerNamespace: cogniflow-eventing
  brokerName: cogniflow-v1
