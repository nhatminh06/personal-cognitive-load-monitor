replicaCount: 2

image:
  repository: ghcr.io/OWNER/REPO/cognitive-load-api
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8000"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

config:
  appEnv: production
  logLevel: INFO
  enableTracing: "true"
  otelExporterOtlpEndpoint: http://tempo.monitoring.svc.cluster.local:4317
  kserveTimeoutSeconds: "3"
  inferenceMode: demo_rule
  modelVersion: ""

# Pre-create this Secret with COGNIFLOW_API_KEY and, for local_model mode,
# MODEL_SHA256. Secret values never belong in Helm values or ConfigMaps.
existingSecret: ""

kserve:
  enabled: false
  name: cognitive-load-classifier
  storageUri: gs://CHANGE_ME_BUCKET/models/cognitive-load-classifier
  minScale: "0"
  maxScale: "3"
  predictor:
    sklearn:
      protocolVersion: v1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

ingress:
  enabled: false
  authSecret: ""
  className: nginx
  annotations: {}
  hosts:
    - host: cognitive-load.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

networkPolicy:
  enabled: true
