{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cognitive-load-monitor.fullname" . }}
  labels:
    {{- include "cognitive-load-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cognitive-load-monitor.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - {protocol: TCP, port: 8000}
  egress:
    # GKE Dataplane V2 metadata endpoint required by Workload Identity.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kserveNamespace }}
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.eventingNamespace }}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports:
        - {protocol: TCP, port: 4317}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.kserve.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cognitive-load-monitor.fullname" . }}-kserve
  labels:
    {{- include "cognitive-load-monitor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: {{ .Values.kserve.name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cognitive-load-monitor.selectorLabels" . | nindent 14 }}
        {{- if eq .Values.kserve.deploymentMode "Knative" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.knativeServingNamespace }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8080}
        {{- if eq .Values.kserve.deploymentMode "Knative" }}
        - {protocol: TCP, port: 8012}
        {{- end }}
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 8080}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
