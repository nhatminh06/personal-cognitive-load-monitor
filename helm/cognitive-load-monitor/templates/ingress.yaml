{{- if .Values.ingress.enabled -}}
{{- if and (eq .Values.config.appEnv "production") (not .Values.ingress.tls) -}}
{{- fail "ingress.tls is required for production ingress" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cognitive-load-monitor.fullname" . }}
  labels:
    {{- include "cognitive-load-monitor.labels" . | nindent 4 }}
  annotations:
    {{- if not .Values.ingress.authSecret }}
    {{- fail "ingress.authSecret must name an externally created Secret when ingress is enabled" }}
    {{- end }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Values.ingress.authSecret | quote }}
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - CogniFlow"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "cognitive-load-monitor.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
