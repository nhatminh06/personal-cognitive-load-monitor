          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-select-component:
      container:
        args:
        - --dataset
        - '{{$.inputs.artifacts[''dataset''].path}}'
        - --manifest
        - '{{$.inputs.artifacts[''dataset_manifest''].path}}'
        - --models
        - '{{$.inputs.artifacts[''candidate_models''].path}}'
        - --validation
        - '{{$.inputs.artifacts[''validation_metrics''].path}}'
        - --output-model
        - '{{$.outputs.artifacts[''selected_model''].path}}'
        - --output-evaluation
        - '{{$.outputs.artifacts[''evaluation''].path}}'
        command:
        - python
        - -m
        - cogniflow_data.kfp_tasks
        - evaluate
        image: localhost:5001/cogniflow-kfp@sha256:8cd171d9d71610e0a29469d86f94caa638662e201563a038d2db06976c43a614
        resources:
          cpuLimit: 1.0
          cpuRequest: 0.25
          memoryLimit: 2.147483648
          memoryRequest: 0.536870912
          resourceCpuLimit: '1'
          resourceCpuRequest: 250m
          resourceMemoryLimit: 2Gi
          resourceMemoryRequest: 512Mi
    exec-importer:
      importer:
        artifactUri:
          runtimeParameter: uri
        typeSchema:
          schemaTitle: system.Dataset
          schemaVersion: 0.0.1
