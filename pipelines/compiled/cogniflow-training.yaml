        pipeline_run_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        provenance:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-register-candidate-component:
    executorLabel: exec-register-candidate-component
    inputDefinitions:
      artifacts:
        dataset_manifest:
          artifactType:
