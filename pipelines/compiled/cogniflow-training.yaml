pipelineInfo:
  description: Validated synthetic-proxy candidate training
  name: cogniflow-kubeflow-training
root:
  dag:
    tasks:
      evaluate-select-component:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-select-component
        dependentTasks:
        - prepare-dataset-component
        - train-candidates-component
        inputs:
          artifacts:
            candidate_models:
              taskOutputArtifact:
                outputArtifactKey: candidate_models
                producerTask: train-candidates-component
            dataset:
              taskOutputArtifact:
                outputArtifactKey: dataset
                producerTask: prepare-dataset-component
            dataset_manifest:
              taskOutputArtifact:
                outputArtifactKey: dataset_manifest
                producerTask: prepare-dataset-component
            validation_metrics:
              taskOutputArtifact:
                outputArtifactKey: validation_metrics
                producerTask: train-candidates-component
        taskInfo:
          name: evaluate-select-component
      importer:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer
        inputs:
          parameters:
            uri:
              componentInputParameter: feature_uri
        taskInfo:
          name: importer
      importer-2:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer-2
        inputs:
          parameters:
            uri:
              componentInputParameter: label_uri
        taskInfo:
          name: importer-2
      importer-3:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-importer-3
        inputs:
          parameters:
            uri:
              componentInputParameter: feature_manifest_uri
        taskInfo:
          name: importer-3
      prepare-dataset-component:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-dataset-component
        dependentTasks:
        - importer
        - importer-2
        - importer-3
        - validate-inputs-component
        inputs:
          artifacts:
            feature_manifest:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer-3
            features:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
            labels:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer-2
            validation:
              taskOutputArtifact:
                outputArtifactKey: validation
                producerTask: validate-inputs-component
          parameters:
            git_revision:
              componentInputParameter: git_revision
            training_cutoff:
              componentInputParameter: training_cutoff
        taskInfo:
          name: prepare-dataset-component
      record-provenance-component:
        cachingOptions: {}
        componentRef:
          name: comp-record-provenance-component
        dependentTasks:
        - evaluate-select-component
        - prepare-dataset-component
        - register-candidate-component
        inputs:
          artifacts:
            dataset_manifest:
              taskOutputArtifact:
                outputArtifactKey: dataset_manifest
                producerTask: prepare-dataset-component
            evaluation:
              taskOutputArtifact:
                outputArtifactKey: evaluation
                producerTask: evaluate-select-component
            registration:
              taskOutputArtifact:
                outputArtifactKey: registration
                producerTask: register-candidate-component
          parameters:
            pipeline_run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
        taskInfo:
          name: record-provenance-component
      register-candidate-component:
        cachingOptions: {}
        componentRef:
          name: comp-register-candidate-component
        dependentTasks:
        - evaluate-select-component
        - prepare-dataset-component
        inputs:
          artifacts:
            dataset_manifest:
              taskOutputArtifact:
                outputArtifactKey: dataset_manifest
                producerTask: prepare-dataset-component
            evaluation:
              taskOutputArtifact:
                outputArtifactKey: evaluation
                producerTask: evaluate-select-component
            selected_model:
              taskOutputArtifact:
                outputArtifactKey: selected_model
                producerTask: evaluate-select-component
          parameters:
            experiment:
              componentInputParameter: mlflow_experiment
            model_name:
              componentInputParameter: mlflow_model_name
            pipeline_run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            tracking_uri:
              componentInputParameter: mlflow_tracking_uri
        taskInfo:
          name: register-candidate-component
      train-candidates-component:
        cachingOptions: {}
        componentRef:
          name: comp-train-candidates-component
        dependentTasks:
        - prepare-dataset-component
        inputs:
          artifacts:
            dataset:
              taskOutputArtifact:
                outputArtifactKey: dataset
                producerTask: prepare-dataset-component
            dataset_manifest:
              taskOutputArtifact:
                outputArtifactKey: dataset_manifest
                producerTask: prepare-dataset-component
        taskInfo:
          name: train-candidates-component
      validate-inputs-component:
        cachingOptions: {}
        componentRef:
          name: comp-validate-inputs-component
        dependentTasks:
        - importer
        - importer-2
        - importer-3
        inputs:
          artifacts:
            feature_manifest:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer-3
            features:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer
            labels:
              taskOutputArtifact:
                outputArtifactKey: artifact
                producerTask: importer-2
          parameters:
            git_revision:
              componentInputParameter: git_revision
        taskInfo:
          name: validate-inputs-component
  inputDefinitions:
    parameters:
      feature_manifest_uri:
        parameterType: STRING
      feature_uri:
        parameterType: STRING
      git_revision:
        parameterType: STRING
      label_uri:
        parameterType: STRING
      mlflow_experiment:
        defaultValue: cogniflow-module3-kfp
        isOptional: true
        parameterType: STRING
      mlflow_model_name:
        defaultValue: cognitive-load-classifier-kfp
        isOptional: true
        parameterType: STRING
      mlflow_tracking_uri:
        parameterType: STRING
      training_cutoff:
        parameterType: STRING
schemaVersion: 2.1.0
