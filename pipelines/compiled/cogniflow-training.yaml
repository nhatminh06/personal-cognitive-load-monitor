    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        dataset_manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        candidate_models:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        validation_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-validate-inputs-component:
    executorLabel: exec-validate-inputs-component
    inputDefinitions:
      artifacts:
        feature_manifest:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        features:
