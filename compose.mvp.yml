name: cogniflow-mvp

services:
  api:
    image: cogniflow-mvp:2026-11-21
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    labels:
      io.cogniflow.owner: mvp-2026-11-21
      io.cogniflow.scope: synthetic-local-demo
    environment:
      APP_ENV: educational_demo
      INFERENCE_MODE: demo_rule
      COGNIFLOW_API_KEY_FILE: /run/secrets/cogniflow_api_key
      FOCUS_SESSION_STORE_PATH: /var/lib/cogniflow/focus-sessions.sqlite3
      MAX_REQUEST_BYTES: "1048576"
      OTEL_SERVICE_NAME: cogniflow-mvp
    secrets:
      - cogniflow_api_key
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - mvp-data:/var/lib/cogniflow
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.0
    mem_limit: 768m
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

secrets:
  cogniflow_api_key:
    file: ./build/mvp/cogniflow_api_key

volumes:
  mvp-data:
    labels:
      io.cogniflow.owner: mvp-2026-11-21
