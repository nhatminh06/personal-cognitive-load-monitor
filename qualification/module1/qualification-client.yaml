apiVersion: v1
kind: ServiceAccount
metadata:
  name: qualification-client
  namespace: cogniflow-qualification
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: qualification-client
  namespace: cogniflow-qualification
  labels:
    app.kubernetes.io/name: qualification-client
spec:
  serviceAccountName: qualification-client
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 100
        capabilities:
          drop: ["ALL"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
