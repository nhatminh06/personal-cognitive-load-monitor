apiVersion: v1
kind: ServiceAccount
metadata:
  name: activity-consumer
  namespace: cogniflow-eventing
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: activity-events
  namespace: cogniflow-eventing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-consumer
  namespace: cogniflow-eventing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: activity-consumer
  template:
    metadata:
      labels:
        app: activity-consumer
    spec:
      serviceAccountName: activity-consumer
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: cogniflow-event-consumer:dev
          imagePullPolicy: Never
          env:
            - name: EVENT_STORE_PATH
              value: /data/events.sqlite3
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /health, port: http}
          readinessProbe:
            httpGet: {path: /ready, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: activity-events}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: activity-consumer
  namespace: cogniflow-eventing
spec:
  type: ClusterIP
  selector: {app: activity-consumer}
  ports:
    - {name: http, port: 80, targetPort: http}
