# A bootstrap cluster administrator applies this after creating the eventing
# namespace. The protected workflow receives namespace-local access only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: cogniflow-eventing
subjects:
  - kind: User
    name: github-actions-deployer@SET_PROJECT.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
