# Requires External Secrets Operator chart 2.13.0 and its images resolved to
# reviewed digests. The Secret value/version is created only by an owner.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: google-secret-manager, namespace: cogniflow}
spec:
  provider:
    gcpsm:
      projectID: SET_PROJECT
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: cognitive-load-gke
          serviceAccountRef:
            name: cogniflow-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: cogniflow-api, namespace: cogniflow}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: google-secret-manager
  target:
    name: cogniflow-api
    creationPolicy: Owner
  data:
    - secretKey: COGNIFLOW_API_KEY
      remoteRef:
        key: cogniflow-api-key
