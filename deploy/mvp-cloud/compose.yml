name: cogniflow-cloud-mvp
services:
  ingress:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      MVP_DOMAIN: ${MVP_DOMAIN:?Set the DNS name before deployment}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
  api:
    image: ${MVP_IMAGE:?Use a verified Artifact Registry digest}
    restart: unless-stopped
    user: '65532:65532'
    environment:
      APP_ENV: educational_demo
      INFERENCE_MODE: demo_rule
      COGNIFLOW_API_KEY_FILE: /run/secrets/cogniflow_api_key
      FOCUS_SESSION_STORE_PATH: /var/lib/cogniflow/focus-sessions.sqlite3
    secrets: [cogniflow_api_key]
    volumes:
      - /srv/cogniflow-mvp/data:/var/lib/cogniflow
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=65532,gid=65532,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1
    mem_limit: 768m
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [frontend]
secrets:
  cogniflow_api_key:
    file: /srv/cogniflow-mvp/secrets/api-key
volumes:
  caddy-data:
  caddy-config:
networks:
  frontend:
