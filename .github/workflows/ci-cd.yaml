name: CI/CD Pipeline

on:
  push:
    branches: [main, feature, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to the current commit SHA."
        required: false
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: cognitive-load
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/cognitive-load-api
  HELM_RELEASE: cognitive-load-monitor

jobs:
  test:
    name: Test with coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies with uv
        run: uv sync --all-extras

      - name: Run Pytest and enforce coverage > 80%
        run: |
          uv run pytest src/tests             --cov=src/preprocessing_api             --cov-report=term-missing             --cov-report=xml             --cov-fail-under=80

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for model packaging
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Train or refresh local model artifact for image context
        run: |
          uv sync --all-extras
          uv run python scripts/train_model.py --input data/raw/sample_data.csv --output models/cognitive_load_model.joblib

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        run: |
          TAG="${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}
            MODEL_URI=${{ secrets.MLFLOW_MODEL_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Manual deploy to Kubernetes with Helm
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_LOCATION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy chart
        run: |
          NAMESPACE="${{ inputs.namespace }}"
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          helm upgrade --install "$HELM_RELEASE" ./helm/cognitive-load-monitor             --namespace "$NAMESPACE"             --create-namespace             --set image.repository="${IMAGE_NAME}"             --set image.tag="$IMAGE_TAG"             --set kserve.storageUri="${{ secrets.KSERVE_STORAGE_URI }}"             --set ingress.hosts[0].host="${{ secrets.APP_HOST }}"
          kubectl rollout status deployment/$HELM_RELEASE -n "$NAMESPACE" --timeout=180s
