name: CI

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out complete commit graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install checksum-pinned Gitleaks 8.30.0
        run: |
          set -euo pipefail
          asset=gitleaks_8.30.0_linux_x64.tar.gz
          curl -fsSL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/$asset" -o "$RUNNER_TEMP/$asset"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version | grep -Fx '8.30.0'
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks-bin/gitleaks" >> "$GITHUB_ENV"

      - name: Test synthetic scanner controls
        run: python -m unittest discover -s src/tests -p test_release_secret_scan.py -v

      - name: Scan proposed tree and complete event commit range
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-range.json"
          gitleaks dir . --config .gitleaks.toml --redact --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks-tree.json"
          python scripts/check_secret_scan.py \
            "$RUNNER_TEMP/gitleaks-range.json" "$RUNNER_TEMP/gitleaks-tree.json"

  test:
    name: Test with coverage gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Run static checks and tests
        run: |
          uv run ruff check src scripts
          uv run pytest src/tests \
            --cov=src/preprocessing_api \
            --cov=src/cogniflow_data \
            --cov=src/cogniflow_eventing \
            --cov=src/cogniflow_anomaly \
            --cov=src/cogniflow_kserve \
            --cov=src/cogniflow_contracts \
            --cov=src/cogniflow_sessions \
            --cov=src/cogniflow_edge \
            --cov=src/cogniflow_focus \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=81

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
