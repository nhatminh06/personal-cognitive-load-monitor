[project]
name = "personal-cognitive-load-monitor"
version = "0.1.0"
description = "Full Stack Data Science/MLOps project for personal cognitive load monitoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0,<1",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "mlflow>=2.8.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
cogniflow-edge = "cogniflow_edge.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cogniflow_edge*", "cogniflow_contracts*"]

[project.optional-dependencies]
cv = [
    "mediapipe==1.2.0",
    "opencv-contrib-python==5.0.0.93",
]
module2 = [
    "boto3>=1.35.0,<2",
    "confluent-kafka>=2.6.0,<3",
    "redis>=5.2.0,<6",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "notebook>=7.0.0",
    "pandas>=2.0.0,<3",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "dvc[s3]>=3.0.0",
    "evidently>=0.4.16",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "ruff==0.15.17",
]
kubeflow = [
    "kfp==2.17.3",
    "kfp-kubernetes==2.17.3",
    "pandas>=2.0.0,<3",
]
kserve = [
    "kserve==0.20.0 ; python_full_version < '3.14'",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.coverage.run]
source = ["src/preprocessing_api", "src/cogniflow_data", "src/cogniflow_eventing", "src/cogniflow_anomaly", "src/cogniflow_kserve", "src/cogniflow_contracts", "src/cogniflow_sessions", "src/cogniflow_edge"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]
