apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-pipeline-persistenceagent
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
        - name: ml-pipeline-persistenceagent
          image: cogniflow-kfp-persistence-agent@sha256:707c3af5abdb6c57902036916fd0d74d6bb014889a30c19e16574a71c92a68dc
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
