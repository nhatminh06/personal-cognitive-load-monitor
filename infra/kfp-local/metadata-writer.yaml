apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-writer
  namespace: kubeflow
spec:
  template:
    spec:
      containers:
        - name: main
          image: cogniflow-metadata-writer@sha256:c2a8d2322156040087818323c1e5d1e685dbb63142f52bad263512fb00fa2ae1
          imagePullPolicy: Never
          env:
            - name: NAMESPACE_TO_WATCH
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: METADATA_GRPC_SERVICE_HOST
              value: metadata-grpc-service
            - name: METADATA_GRPC_SERVICE_PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
