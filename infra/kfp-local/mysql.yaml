apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: kubeflow
spec:
  template:
    spec:
      securityContext:
        fsGroup: 27
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: cogniflow/mysql@sha256:febda51c2aa5e451cb2d4161f1c82f731dc5e36cbf06be80eea4ed17e9dcb5e6
          imagePullPolicy: Never
          args:
            - --datadir
            - /var/lib/mysql
            - --authentication-policy=mysql_native_password
            - --mysql-native-password=ON
            - --disable-log-bin
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              $patch: delete
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogniflow-mysql
                  key: root-password
            - name: MYSQL_DATABASE
              value: metadb
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: cogniflow-mysql
                  key: username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cogniflow-mysql
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 27
            runAsNonRoot: true
            runAsUser: 27
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            postStart:
              exec:
                command: [/bin/bash, /docker-entrypoint-initdb.d/02-grant-kfp-databases.sh]
          volumeMounts:
            - name: mysql-tmp
              mountPath: /tmp
            - name: mysql-run
              mountPath: /var/run/mysqld
      volumes:
        - name: mysql-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: mysql-run
          emptyDir:
            sizeLimit: 16Mi
