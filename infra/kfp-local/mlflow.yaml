apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogniflow-kfp-mlflow
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cogniflow-kfp-mlflow
  template:
    metadata:
      labels:
        app: cogniflow-kfp-mlflow
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: cogniflow-mlflow@sha256:de0b5f8bbd26bfea3693700b90a9602cfb5620cb64887a908da60bad4ba863b5
          imagePullPolicy: Never
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: cogniflow-mlflow
                  key: backend-store-uri
            - name: MLFLOW_ARTIFACTS_DESTINATION
              value: s3://mlpipeline/mlflow
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://seaweedfs.kubeflow.svc.cluster.local:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlpipeline-minio-artifact
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlpipeline-minio-artifact
                  key: secretkey
            - name: MLFLOW_ALLOWED_HOSTS
              value: cogniflow-kfp-mlflow.kubeflow.svc.cluster.local:5000,cogniflow-kfp-mlflow.kubeflow.svc:5000,cogniflow-kfp-mlflow:5000,localhost:5000,127.0.0.1:5000
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cogniflow-kfp-mlflow
  namespace: kubeflow
spec:
  selector:
    app: cogniflow-kfp-mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
