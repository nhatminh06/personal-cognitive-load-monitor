server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: cognitive-load-api
    static_configs:
      - targets: [localhost]
        labels:
          job: cognitive-load-api
          service_name: cognitive-load-api
          __path__: /var/log/cogniflow/api.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
  - job_name: cognitive-load-kserve
    static_configs:
      - targets: [localhost]
        labels:
          job: cognitive-load-kserve
          service_name: cognitive-load-kserve
          __path__: /var/log/cogniflow/kserve.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
